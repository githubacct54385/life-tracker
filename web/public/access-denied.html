<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Access denied</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
      main { max-width: 28rem; }
      a { display: inline-block; padding: 0.75rem 1rem; min-height: 44px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <main>
      <h1>Access denied</h1>
      <p>This is a private app. The account you signed in with does not have access.</p>
      <p><a href="/.auth/logout?post_logout_redirect_uri=/">Sign out and try another account</a></p>
    </main>
  </body>
</html>
