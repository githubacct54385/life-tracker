<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signed out</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
      main { max-width: 28rem; }
      a { display: inline-block; padding: 0.75rem 1rem; min-height: 44px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are signed out</h1>
      <p>This is a private app. Signing in again uses the GitHub account you are signed in to on github.com.</p>
      <p><a href="/.auth/login/github">Sign in with GitHub</a></p>
      <p>To use a different account, <a href="https://github.com/logout">sign out of GitHub</a> first, then come back and sign in.</p>
    </main>
  </body>
</html>
