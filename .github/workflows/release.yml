name: Release

# The only way to production (ADR-0004, FND-06). Merging to main never deploys.
#
# Manual only. Waits for owner approval on the `production` environment.
# Order matters: migrations first, then deploy. A failed migration stops everything.
#
# Environment secrets needed (set on the `production` environment, never in the repo):
#   DATABASE_ADMIN_URL      (Neon admin login, used only to migrate)
#   CLOUDFLARE_API_TOKEN    (scoped to editing Workers on this one account, used only to deploy)
#   CLOUDFLARE_ACCOUNT_ID   (which account the Worker lives in)
# The Worker's own runtime settings (DATABASE_URL, ACCESS_TEAM_DOMAIN, ACCESS_AUD, OWNER_EMAIL) are set once in
# Cloudflare and are not touched by this workflow. See docs/cloudflare-access-setup.md.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production # requires the owner's approval; limited to the main branch
    steps:
      - name: Releases run from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases run from main only."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Waits for CI on this commit instead of failing while it is still running, so a release can be started
      # right after a merge. A failed check stops at once. Nothing below this step runs until both have passed.
      - name: CI must have passed on this exact commit
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One state per check: pass (a run succeeded), fail (all runs finished, none succeeded), wait (otherwise).
          state() {
            echo "$runs" | jq -r --arg n "$1" '
              [.check_runs[] | select(.name == $n)] as $r
              | if ([$r[] | select(.conclusion == "success")] | length) > 0 then "pass"
                elif ([$r[] | select(.status != "completed")] | length) > 0 then "wait"
                elif ($r | length) > 0 then "fail"
                else "wait" end'
          }
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100") || runs='{"check_runs":[]}'
            waiting=""
            for name in hygiene test; do
              case "$(state "$name")" in
                pass) ;;
                fail) echo "Required check '$name' failed on ${GITHUB_SHA}. Not releasing."; exit 1 ;;
                *) waiting="$waiting $name" ;;
              esac
            done
            if [ -z "$waiting" ]; then
              echo "CI passed on ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for CI on ${GITHUB_SHA}:${waiting} (attempt ${attempt} of 40)"
            sleep 15
          done
          echo "CI did not finish within 10 minutes for ${GITHUB_SHA}. Not releasing. Run Release again once CI is done."
          exit 1

      - name: Start the run summary
        run: |
          {
            echo "## Release"
            echo "**Commit:** \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Apply SQL migrations
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        # `pnpm migrate` (api/src/db/migrate-cli.ts) appends the list of applied migrations to $GITHUB_STEP_SUMMARY (AC-FND-06.6).
        run: pnpm migrate

      # `wrangler` is a dev dependency of the API package. It uploads the Worker and the built site (web/dist) together.
      # --keep-vars leaves the settings and secrets already stored in Cloudflare alone.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @life-tracker/api exec wrangler deploy --keep-vars

      - name: Summary
        if: success()
        run: echo "**Result:** Worker deployed." >> "$GITHUB_STEP_SUMMARY"
