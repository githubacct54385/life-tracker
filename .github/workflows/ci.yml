name: CI

# Required checks on main are the two job names below: `hygiene` and `test`.
# Merging to main does NOT deploy. See release.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly full run, to catch dependency drift

permissions:
  contents: read
  actions: read # to read the coverage numbers from the latest run on main (OPS-09)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repo hygiene (forbidden files, secret-like strings, commit emails, migrations)
        env:
          HYGIENE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: bash scripts/check-hygiene.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Acceptance criteria traceability
        run: node scripts/ac-coverage.mjs
      - name: What the automated tests check (job summary)
        run: node scripts/tests-list.mjs --markdown >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway Postgres for the browser tests (OPS-04). They run the real Worker and API against it, applying the real
    # migrations and the real least-privilege app role. It lives only for this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # No password: the database only exists inside this job and listens on the runner's own loopback port.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lt_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lt_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Look for app code
        id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet, so there is nothing to build or test."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.app.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint and layer rules
        if: steps.app.outputs.present == 'true'
        run: pnpm lint
      - name: Type check
        if: steps.app.outputs.present == 'true'
        run: pnpm typecheck
      # Unit tests run with coverage (OPS-09). A package under its minimum in coverage.config.json fails here.
      - name: Unit tests (with coverage)
        if: steps.app.outputs.present == 'true'
        run: |
          pnpm coverage:unit
          pnpm exec vitest run --root scripts
      - name: Integration tests (Postgres in a container, with coverage)
        if: steps.app.outputs.present == 'true'
        run: pnpm coverage:int
      - name: Coverage summary (job summary, and the change against main)
        if: always() && steps.app.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            run_id=$(gh run list --workflow CI --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$run_id" ]; then gh run download "$run_id" --name coverage-summary --dir coverage-baseline || true; fi
            if [ -f coverage-baseline/summary.json ]; then baseline="--baseline coverage-baseline"; fi
          fi
          node scripts/coverage-summary.mjs $baseline
          node scripts/coverage-summary.mjs $baseline --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Save the coverage report
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            shared/coverage
            api/coverage
            web/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Save the coverage numbers (the next pull request compares with these)
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/summary.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Build
        if: steps.app.outputs.present == 'true'
        run: pnpm build
      - name: Worker bundle size (AC-MIG-03.6)
        if: steps.app.outputs.present == 'true'
        run: pnpm check:worker-size
      # The browser download comes from Playwright's own servers. It is kept apart from the system libraries, which
      # come from Ubuntu's package servers through apt: an outage there once held this job for 20 minutes (OPS-03).
      - name: Install browser
        if: steps.app.outputs.present == 'true'
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium
      # Most runners already have the libraries Chromium needs, so first just try to start it. Only if it cannot
      # start do we reach for apt, which then gets 2 hard-limited attempts. The end-to-end tests are the final check.
      - name: Check the browser can start
        id: launch
        if: steps.app.outputs.present == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: pnpm --filter web exec node -e "import('@playwright/test').then(async ({ chromium }) => { const browser = await chromium.launch(); await browser.close(); })"
      - name: Install browser system libraries (only if the browser cannot start)
        if: steps.app.outputs.present == 'true' && steps.launch.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            if timeout -k 10 60 pnpm --filter web exec playwright install-deps chromium; then exit 0; fi
            echo "::warning::System library install failed (attempt $attempt of 2)."
            sleep 5
          done
          echo "::warning::System libraries were not installed. If the end-to-end tests cannot start the browser, this is why."
          exit 0
      - name: End-to-end tests (real Worker, API and Postgres; some screen checks fake the API, see TESTING.md)
        if: steps.app.outputs.present == 'true'
        env:
          E2E_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/lt_e2e
        run: pnpm test:e2e
