name: CI

# Required checks on main are the two job names below: `hygiene` and `test`.
# Merging to main does NOT deploy. See release.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly full run, to catch dependency drift

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repo hygiene (forbidden files, secret-like strings, commit emails, migrations)
        env:
          HYGIENE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: bash scripts/check-hygiene.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Acceptance criteria traceability
        run: node scripts/ac-coverage.mjs

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Look for app code
        id: app
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet, so there is nothing to build or test."
          fi
      - uses: pnpm/action-setup@v6
        if: steps.app.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint and layer rules
        if: steps.app.outputs.present == 'true'
        run: pnpm lint
      - name: Type check
        if: steps.app.outputs.present == 'true'
        run: pnpm typecheck
      - name: Unit tests
        if: steps.app.outputs.present == 'true'
        run: pnpm test:unit
      - name: Integration tests (Postgres in a container)
        if: steps.app.outputs.present == 'true'
        run: pnpm test:int
      - name: Build
        if: steps.app.outputs.present == 'true'
        run: pnpm build
      - name: Worker bundle size (AC-MIG-03.6)
        if: steps.app.outputs.present == 'true'
        run: pnpm check:worker-size
      # The browser download comes from Playwright's own servers. It is kept apart from the system libraries, which
      # come from Ubuntu's package servers through apt: an outage there once held this job for 20 minutes (OPS-03).
      - name: Install browser
        if: steps.app.outputs.present == 'true'
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium
      - name: Install browser system libraries (retried, never fails the job)
        if: steps.app.outputs.present == 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if timeout 90 pnpm --filter web exec playwright install-deps chromium; then exit 0; fi
            echo "::warning::System library install failed (attempt $attempt of 3)."
            sleep 10
          done
          echo "::warning::System libraries were not installed. If the end-to-end tests cannot start the browser, this is why."
          exit 0
      - name: End-to-end tests
        if: steps.app.outputs.present == 'true'
        run: pnpm test:e2e
